version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    assignees:
      - martinalbrecht-berlin
    commit-message:
      prefix: "chore(deps)"
    groups:
      development-tooling:
        dependency-type: development
        patterns:
          - "*"
        exclude-patterns:
          - openclaw
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    assignees:
      - martinalbrecht-berlin
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
